<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAC Bingo</title><link rel="stylesheet" href="assets/style.css"></head><body>
<header class="topbar"><a href="index.html">HSC Society &amp; Culture Revision</a><nav><a href="games.html">Games</a><a href="past-questions.html">Past Questions</a><a href="how-to.html">How to Answer</a></nav></header>
<main class="wrap"><span class="tag">CLASS / SOLO</span><h1>SAC Bingo</h1><p class="lead">Whole-class or solo concept revision. Generate a 3×3 card, then reveal clues one at a time. Click a square when you think the clue matches it.</p>
<div class="gamebar"><button id="new">New Card</button><button id="clue">Reveal Next Clue</button></div><div id="cluetxt" class="notice">Generate a card to begin.</div><div id="board" class="bingo"></div></main><script>let all=[],card=[],clues=[];fetch('data/easy-games.json').then(r=>r.json()).then(d=>{all=d.bingo;newCard()});function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function newCard(){card=shuffle(all).slice(0,9);clues=shuffle(card);document.getElementById('cluetxt').textContent='Card ready. Reveal the first clue.';document.getElementById('board').innerHTML=card.map((x,i)=>`<button class="bingoCell" onclick="this.classList.toggle('used')">${x.term}</button>`).join('')}document.getElementById('new').onclick=newCard;document.getElementById('clue').onclick=()=>{if(!clues.length){document.getElementById('cluetxt').textContent='All clues revealed.';return}let x=clues.pop();document.getElementById('cluetxt').innerHTML=`<b>Clue:</b> ${x.clue}`}</script></body></html>
