<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Who Am I?</title><link rel="stylesheet" href="assets/style.css"></head><body>
<header class="topbar"><a href="index.html">HSC Society &amp; Culture Revision</a><nav><a href="games.html">Games</a><a href="past-questions.html">Past Questions</a><a href="how-to.html">How to Answer</a></nav></header>
<main class="wrap"><span class="tag">QUICK REVISION</span><h1>Who Am I?</h1><p class="lead">Reveal clues one at a time. Try to identify the concept, method or case-study evidence using as few clues as possible.</p><div class="panel"><div id="clues"></div><button id="reveal">Reveal a clue</button> <button id="answer">Show answer</button> <button id="next">Next</button><div id="ans" class="notice" style="display:none"></div></div></main><script>let qs=[],x,n=0;fetch('data/easy-games.json').then(r=>r.json()).then(d=>{qs=d.whoami;next()});function next(){x=qs[Math.floor(Math.random()*qs.length)];n=0;document.getElementById('clues').innerHTML='';document.getElementById('ans').style.display='none'}document.getElementById('reveal').onclick=()=>{if(n<x.clues.length)document.getElementById('clues').innerHTML+=`<p><b>Clue ${n+1}:</b> ${x.clues[n++]}</p>`};document.getElementById('answer').onclick=()=>{let a=document.getElementById('ans');a.style.display='block';a.innerHTML=`<b>${x.answer}</b>`};document.getElementById('next').onclick=next;</script></body></html>
