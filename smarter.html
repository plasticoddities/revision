<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/styles.css"><title>Are You Smarter Than Mr Forsyth?</title></head><body><nav><div class="wrap"><a class="brand" href="index.html">HSC SOCIETY & CULTURE</a><a href="multiple-choice.html">Multiple Choice</a><a href="games.html">Games</a><a href="past-questions.html">Past Questions</a><a href="how-to.html">How to Answer</a></div></nav>
<header class="gamehero"><div class="wrap"><div class="eyebrow">HSC GAME SHOW</div><h1>Are You Smarter Than Mr Forsyth?</h1><p>Ten questions. Three lifelines. One extremely important title.</p></div></header>
<main class="wrap"><div class="grid" style="grid-template-columns:2fr 1fr"><div class="panel" id="game"></div><div><div class="panel"><h3>Progress</h3><div id="ladder" class="ladder"></div></div><div class="panel"><h3>Lifelines</h3><div class="lifelines"><button class="btn" id="fifty">50/50</button><button class="btn" id="ask">Ask Mr Forsyth</button><button class="btn" id="notes">Check Your Notes</button></div></div></div></div></main>
<script>
let bank=[],n=0,score=0,current=null,used={fifty:false,ask:false,notes:false};const labels=['YEAR 5','YEAR 6','YEAR 7','YEAR 8','YEAR 9','YEAR 10','YEAR 11','YEAR 12','HSC','HSC MASTER'];
async function init(){bank=await fetch('data/questions.json').then(r=>r.json());render()}
function draw(){let target=Math.min(6,Math.max(1,Math.ceil((n+1)*6/10)));let pool=bank.filter(x=>Math.abs(x.level-target)<=1);return pool[Math.floor(Math.random()*pool.length)]}
function ladderDraw(){ladder.innerHTML='';[...labels].reverse().forEach((x,ri)=>{let idx=9-ri,d=document.createElement('div');d.className='rung '+(idx===n?'active':'');d.textContent=(idx+1)+'  '+x;ladder.appendChild(d)})}
function render(){ladderDraw();if(n>=10){game.innerHTML='<h2>You are smarter than Mr Forsyth.</h2><p>Please do not make a big deal about it.</p><button class="btn" onclick="location.reload()">Play Again</button>';return}current=draw();game.innerHTML='<div class="eyebrow">'+current.area+' • '+labels[n]+'</div><h2>'+current.q+'</h2><div id="opts" class="answers"></div><div id="fb"></div>';current.o.forEach((o,i)=>{let b=document.createElement('button');b.className='btn';b.dataset.i=i;b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>answer(i);opts.appendChild(b)})}
function answer(i){document.querySelectorAll('#opts button').forEach(z=>z.disabled=true);if(i===current.a){score++;fb.innerHTML='<div class="feedback"><b>Correct.</b><p>'+current.e+'</p><button class="btn" id="continue">Continue</button></div>';continue.onclick=()=>{n++;render()}}else{fb.innerHTML='<div class="feedback"><h2>You are apparently not smarter than Mr Forsyth.</h2><p><b>Correct answer:</b> '+current.o[current.a]+'</p><p>'+current.e+'</p><button class="btn" onclick="location.reload()">Play Again</button></div>'}}
fifty.onclick=()=>{if(used.fifty||!current)return;used.fifty=true;fifty.disabled=true;let wrong=[...document.querySelectorAll('#opts button')].filter(b=>+b.dataset.i!==current.a);wrong.sort(()=>Math.random()-.5).slice(0,2).forEach(b=>b.style.visibility='hidden')};
notes.onclick=()=>{if(used.notes||!current)return;used.notes=true;notes.disabled=true;fb.innerHTML='<div class="feedback"><b>Check your notes:</b> '+current.hint+'</div>'};
ask.onclick=()=>{if(used.ask||!current)return;used.ask=true;ask.disabled=true;let right=Math.random()<.8;let choice=right?current.a:[0,1,2,3].filter(i=>i!==current.a)[Math.floor(Math.random()*3)];fb.innerHTML='<div class="feedback"><b>Mr Forsyth thinks:</b> '+String.fromCharCode(65+choice)+'. '+current.o[choice]+'<p>He is usually right. Usually.</p></div>'};
init();
</script></body></html>
