<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/styles.css"><title>Multiple Choice</title></head><body><nav><div class="wrap"><a class="brand" href="index.html">HSC SOCIETY & CULTURE</a><a href="multiple-choice.html">Multiple Choice</a><a href="games.html">Games</a><a href="past-questions.html">Past Questions</a><a href="how-to.html">How to Answer</a></div></nav>
<header class="hero"><div class="wrap"><div class="eyebrow">PRACTISE</div><h1>Multiple Choice</h1><p class="lead">Original syllabus-aligned revision questions. These are practice questions, not reproduced NESA exam questions.</p></div></header>
<main class="wrap"><div class="panel"><div id="area" class="eyebrow"></div><h2 id="q">Loading…</h2><div id="answers" class="answers"></div><div id="feedback"></div><p><button class="btn" id="next">Next Question</button></p></div></main>
<script>
let bank=[];async function start(){bank=await fetch('data/questions.json').then(r=>r.json());nextQ()}
function nextQ(){let x=bank[Math.floor(Math.random()*bank.length)];area.textContent=x.area;q.textContent=x.q;answers.innerHTML='';feedback.innerHTML='';x.o.forEach((o,i)=>{let b=document.createElement('button');b.className='btn';b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>{feedback.innerHTML='<div class="feedback"><b>'+(i===x.a?'Correct':'Not quite')+'</b><p>'+x.e+'</p></div>';document.querySelectorAll('#answers button').forEach(z=>z.disabled=true)};answers.appendChild(b)})};next.onclick=nextQ;start();
</script></body></html>
